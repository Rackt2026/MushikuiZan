<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>虫食い算ひろば｜まなびやつばめ</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(125deg,#fff5bd,#c4f8ec 42%,#c4f1ff 67%,#efdff6);color:#303851;font-family:ui-rounded,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;padding:clamp(12px,4vw,50px) 10px}main{max-width:880px;margin:auto;background:#fcfffd;border:3px solid white;border-radius:30px;padding:clamp(16px,3vw,34px);box-shadow:0 9px #d6cfb9,0 18px 40px #487b8430}header{text-align:center}small{color:#617483;font-weight:bold;letter-spacing:.13em}h1{color:#dc6700;font-size:clamp(32px,5vw,52px);margin:5px 0 10px;letter-spacing:.05em}p{margin:8px 0 15px}button,input,select{font:inherit}button,select{cursor:pointer}button{color:inherit;font-weight:bold;border-radius:15px;padding:12px 18px;background:white;border:2px solid #d6dfe3;box-shadow:0 4px #d6dfe3}button:active{transform:translateY(2px)}button[aria-pressed=true]{border-color:#9369cf;background:#f6efff;box-shadow:0 4px #b899df;color:#623e93}.primary{background:linear-gradient(#ffbc39,#ff890d);border-color:#ffb437;color:#452700;box-shadow:0 5px #d17409;font-size:1.15rem}.board{margin:20px 0 14px;padding:clamp(18px,4vw,36px);border-radius:22px;text-align:center;background:radial-gradient(#fff9 1.5px,transparent 2px) 0 0/19px 19px,linear-gradient(155deg,#e3f8fb,#fff4cd);border:2px solid #fff3d4}.tiles{display:flex;justify-content:center;align-items:center;gap:clamp(5px,1.6vw,16px);font-weight:900;font-size:clamp(24px,5vw,52px);min-height:84px}.tile{display:inline-grid;place-items:center;background:white;border:3px solid #ffdf84;border-radius:14px;min-width:1.55em;height:1.55em;box-shadow:0 5px #ddd6b8;transform:rotate(-5deg)}.tile:last-child{transform:rotate(5deg)}.hole{border:3px dashed #e58431;border-radius:12px;color:#ad570e;background:#fff9de;display:inline-block;min-width:1.25em;text-align:center}.solved{background:#dbf8dc;border-color:#36a26a;color:#136637}fieldset{border:0;padding:0;margin:16px 0}legend,label{font-weight:bold;margin-bottom:7px} .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row button{flex:1}.settings{display:grid;grid-template-columns:2fr 1fr;gap:16px}.settings label{display:grid;gap:7px}select,input{width:100%;padding:10px;border:2px solid #cddbe1;border-radius:12px;background:white;color:#303851}.foot{text-align:center;margin:14px 0 4px}.stats{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:20px}.stats span{border:2px solid #ffda79;border-radius:20px;padding:5px 14px;background:white;font-weight:bold}.eq{font-size:clamp(28px,6.8vw,68px);font-weight:900;line-height:1.7;font-variant-numeric:tabular-nums}.board form{margin:14px auto 0;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.board input{width:110px;text-align:center;font-weight:bold;font-size:22px}#msg{font-weight:bold;color:#484174;min-height:1.5em}.quiet{font-size:.88rem;padding:7px 14px}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #4c66bd;outline-offset:3px}[hidden]{display:none!important}@media(max-width:520px){.settings{grid-template-columns:1fr;gap:4px}.row button{padding:10px 4px}.board{padding:18px 5px}}
</style><main><header><small>まなびやつばめ　算数チャレンジ</small><h1>虫食い算ひろば</h1></header><section id="home"><div class="board"><div class="tiles" aria-label="8 たす はてな は 13"><b class="tile">8</b>＋<b class="hole">?</b>＝<b class="tile">13</b></div><p>かくれた数は、いくつかな？</p></div><fieldset><legend>学び方をえらぼう</legend><div class="row"><button id="solo" aria-pressed="true">一人で学習</button><button id="group" aria-pressed="false">みんなで学習</button></div></fieldset><div class="settings"><label>レベル<select id="level"><option>Lv.1　20までの たし算・ひき算</option><option>Lv.2　九九とかけ算・わり算</option><option>Lv.3　筆算の数字さがし</option><option>Lv.4　小数のたし算・ひき算</option><option>Lv.5　正負の数と方程式</option></select></label><label>問題数<select id="count"><option>5</option><option selected>10</option><option>20</option></select></label></div><div class="foot"><p id="guide"></p><button class="primary" id="start">チャレンジ開始！</button></div></section><section id="play" hidden><div id="stats" class="stats"></div><div class="board"><b id="prompt"></b><div id="eq" class="eq"></div><form id="form"><input id="entry" aria-label="答えの数" autocomplete="off" maxlength="12"><button class="primary">答え合わせ</button></form><p id="msg" role="status"></p><button id="reveal">答えを見る</button> <button class="primary" id="next">次の問題へ</button></div><button class="quiet" id="quit">はじめの画面へ</button></section><section class="foot" id="result" hidden><div class="board"><h2>チャレンジ完了！</h2><div id="summary"></div></div><button class="primary" id="again">もう一度挑戦</button> <button id="back">設定へ戻る</button></section></main><script>
const $=id=>document.getElementById(id), rand=(min,max)=>min+Math.floor(Math.random()*(max-min+1));
let group=false,deck=[],index,score,miss,done,startTime,elapsed,clock;
function mode(shared){group=shared;$('solo').setAttribute('aria-pressed',!shared);$('group').setAttribute('aria-pressed',shared);$('guide').textContent=shared?'みんなで考えたら、先生が答えを表示！':'一度で正解すると10点。満点タイムにも挑戦！'}
$('solo').onclick=()=>mode(false);$('group').onclick=()=>mode(true);mode(false);
function puzzle(l){
 let a=rand(1,9),b=rand(1,9),plus=rand(0,1),s=plus?'＋':'－',q,n;
 if(l===0){q=plus?a+' ＋ # ＝ '+(a+b):(a+b)+' － # ＝ '+a;n=b}
 if(l===1){q=plus?a+' × # ＝ '+a*b:a*b+' ÷ # ＝ '+a;n=b}
 if(l===2){a=rand(20,79);b=rand(11,19);let str=String(a),i=rand(0,1);n=Number(str[i]);q=str.slice(0,i)+'#'+str.slice(i+1)+' '+s+' '+b+' ＝ '+(plus?a+b:a-b)}
 if(l===3){a=rand(10,65);b=rand(1,29);q=(plus?a/10:(a+b)/10)+' '+s+' # ＝ '+(plus?(a+b)/10:a/10);n=b/10}
 if(l===4){n=rand(-9,9);a=rand(2,8);q=a+' × (#) '+s+' '+b+' ＝ '+(a*n+(plus?b:-b))}
 return {q,n}
}
function screen(id){for(const key of ['home','play','result'])$(key).hidden=key!==id}
function start(){clearInterval(clock);deck=[];let seen=new Set;while(deck.length<Number($('count').value)){let p=puzzle($('level').selectedIndex);if(!seen.has(p.q)){deck.push(p);seen.add(p.q)}}index=0;score=0;elapsed=0;screen('play');question();clock=setInterval(stats,250)}
function seconds(){return (elapsed+(done?0:performance.now()-startTime))/1000}
function stats(){$('stats').innerHTML='<span>Lv.'+($('level').selectedIndex+1)+'</span><span>第 '+(index+1)+' 問 / '+deck.length+' 問</span>'+(group?'':'<span>'+score+' 点</span><span>'+Math.floor(seconds())+' 秒</span>')}
function equation(show){let p=deck[index];$('eq').innerHTML=p.q.replace('#','<span class="hole '+(show?'solved':'')+'">'+(show?p.n:'?')+'</span>')}
function question(){miss=false;done=false;startTime=performance.now();$('prompt').textContent=$('level').selectedIndex===2?'かくれた数字を1つ見つけよう':'かくれた数を見つけよう';equation(false);$('form').hidden=group;$('entry').value='';$('entry').inputMode=$('level').selectedIndex===4?'text':$('level').selectedIndex===3?'decimal':'numeric';$('msg').textContent='';$('next').hidden=true;$('reveal').hidden=false;$('next').textContent=index===deck.length-1?'結果を見る':'次の問題へ';stats();if(!group)$('entry').focus()}
function finish(revealed){if(done)return;elapsed+=performance.now()-startTime;done=true;equation(true);$('form').hidden=true;$('reveal').hidden=true;$('next').hidden=false;if(!group&&!revealed)score+=miss?5:10;$('msg').textContent=revealed?'答えは '+deck[index].n+' です！':'正解！　＋'+(miss?5:10)+'点';stats();$('next').focus()}
$('form').onsubmit=e=>{e.preventDefault();if(done)return;let v=$('entry').value.normalize('NFKC').trim().replace(/−/g,'-');if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(v)){$('msg').textContent='数字を入力してね。';return}if(Number(v)===deck[index].n)finish(false);else{miss=true;$('msg').textContent='おしい！　式に数を入れて確かめよう。';$('entry').select()}};
$('reveal').onclick=()=>finish(true);
function results(){clearInterval(clock);screen('result');let time=seconds(),max=deck.length*10,html=deck.length+'問の虫食い算を解きました。';if(!group){html='<h2>'+score+' / '+max+' 点</h2><p>考えた時間　'+time.toFixed(1)+' 秒</p>';try{let key='mushikui-v1-'+$('level').selectedIndex+'-'+deck.length,best=JSON.parse(localStorage.getItem(key)||'{}');best.score=Math.max(best.score||0,score);if(score===max)best.time=Math.min(best.time??Infinity,time);localStorage.setItem(key,JSON.stringify(best));html+='自己ベスト　'+best.score+' 点'+(best.time!=null?' ／ 満点の最速　'+best.time.toFixed(1)+' 秒':'')}catch{}}$('summary').innerHTML=html}
$('next').onclick=()=>{if(index+1===deck.length)results();else{index++;question()}};$('quit').onclick=()=>{if(confirm('今のチャレンジを終わりますか？')){clearInterval(clock);screen('home')}};$('start').onclick=$('again').onclick=start;$('back').onclick=()=>screen('home');
</script></html>
